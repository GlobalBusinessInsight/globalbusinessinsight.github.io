<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
<title id="title">全球电子发票制度路线 / Global e-invoicing landscape</title>
<desc id="desc">Representative e-invoicing systems as of November 2026 grouped by region: Europe has country-specific structured invoice mandates and a 2030/2035 EU digital reporting roadmap; the Americas show tax authorization models; Asia-Pacific combines tax platforms, Peppol exchange and reporting; Saudi Arabia phases platform integration by wave; Kenya broadly requires electronic tax invoices.</desc>
<defs><style>
text{font-family:Arial,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#17333b}.h{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#56696b}.rh{font-size:18px;font-weight:700}.ct{font-size:15px;font-weight:700}.tx{font-size:13px;fill:#43585c}.date{font-size:12px;fill:#617270}
.panel{fill:#fffefa;stroke:#cbd6cf;stroke-width:2;rx:16}.tag{fill:#e9f0e8;stroke:#b9cabe;stroke-width:1.3;rx:10}.accent{fill:#17634f}.amber{fill:#fff1dc;stroke:#d1a153;stroke-width:1.5;rx:10}.blue{fill:#edf3f7;stroke:#9ab2c4;stroke-width:1.5;rx:10}.line{stroke:#ced8d0;stroke-width:2}
</style></defs>
<rect width="1400" height="920" fill="#f2f4ef"/>
<text x="55" y="56" class="h">电子发票的全球制度路线 · 2026 年快照</text>
<text x="55" y="83" class="sub">Representative jurisdictional models · A regional overview, not a legal compliance checklist</text>
<rect x="55" y="109" width="1290" height="58" class="panel"/>
<rect x="78" y="125" width="17" height="17" class="accent" rx="4"/><text x="104" y="140" class="tx">Tax authorization / central exchange</text>
<rect x="385" y="125" width="17" height="17" fill="#5d809e" rx="4"/><text x="411" y="140" class="tx">Business network / e-reporting</text>
<rect x="727" y="125" width="17" height="17" fill="#d4a457" rx="4"/><text x="753" y="140" class="tx">Phased transition / upcoming dates</text>
<text x="1100" y="140" class="date">Snapshot: 24 Nov 2026</text>

<rect x="55" y="190" width="625" height="320" class="panel"/>
<text x="80" y="225" class="rh">欧洲 · EUROPE</text>
<rect x="80" y="247" width="270" height="99" class="tag"/>
<text x="99" y="273" class="ct">比利时 / Belgium</text><text x="99" y="298" class="tx">结构化 B2B · Peppol 为默认路线</text><text x="99" y="324" class="date">生效：2026-01-01</text>
<rect x="372" y="247" width="280" height="99" class="amber"/>
<text x="391" y="273" class="ct">法国 / France</text><text x="391" y="298" class="tx">分阶段 e-invoicing + e-reporting</text><text x="391" y="324" class="date">2026 大/中型 · 2027 SME/微型</text>
<rect x="80" y="366" width="270" height="99" class="blue"/>
<text x="99" y="392" class="ct">德国 / Germany</text><text x="99" y="417" class="tx">买方接收义务已生效，卖方过渡</text><text x="99" y="443" class="date">开具过渡期按主体至 2027</text>
<rect x="372" y="366" width="280" height="99" class="tag"/>
<text x="391" y="392" class="ct">波兰 / Poland</text><text x="391" y="417" class="tx">KSeF 2.0 国家平台强制开具</text><text x="391" y="443" class="date">2026-02 / 2026-04 分阶段</text>
<text x="80" y="490" class="date">EU ViDA：跨境 B2B 报告目标 2030；国内系统对齐 2035</text>

<rect x="705" y="190" width="640" height="320" class="panel"/>
<text x="730" y="225" class="rh">美洲 · AMERICAS</text>
<rect x="730" y="247" width="280" height="99" class="tag"/>
<text x="749" y="273" class="ct">巴西 / Brazil</text><text x="749" y="298" class="tx">NF-e · 州级 SEFAZ 前置授权</text><text x="749" y="324" class="date">授权校验不担保商业实质</text>
<rect x="1032" y="247" width="285" height="99" class="tag"/>
<text x="1051" y="273" class="ct">墨西哥 / Mexico</text><text x="1051" y="298" class="tx">CFDI 4.0 · XML 与税务认证</text><text x="1051" y="324" class="date">唯一有效版本：2023-04 起</text>
<rect x="730" y="366" width="587" height="99" class="blue"/>
<text x="749" y="392" class="ct">北美业务网络 / North American business networks</text><text x="749" y="417" class="tx">B2B EDI 与供应商网络不等同全国性税务清关</text><text x="749" y="443" class="date">交易网络规则与各地税务文件并行管理</text>

<rect x="55" y="535" width="625" height="320" class="panel"/>
<text x="80" y="570" class="rh">亚太 · ASIA-PACIFIC</text>
<rect x="80" y="592" width="270" height="99" class="tag"/>
<text x="99" y="618" class="ct">中国 / China</text><text x="99" y="643" class="tx">数电发票全国推广 · 税务数字平台</text><text x="99" y="669" class="date">2024-12 起</text>
<rect x="372" y="592" width="280" height="99" class="blue"/>
<text x="391" y="618" class="ct">新加坡 / Singapore</text><text x="391" y="643" class="tx">InvoiceNow(Peppol) + IRAS 数据报送</text><text x="391" y="669" class="date">延展至 GST 企业分批：2028–2031</text>
<rect x="80" y="711" width="572" height="99" class="amber"/>
<text x="99" y="737" class="ct">澳大利亚 / Australia</text><text x="99" y="762" class="tx">Peppol 互通 · 政府采购带动，商业使用采用中</text><text x="99" y="788" class="date">联邦采购多数机构计划 2027-01 起默认使用</text>

<rect x="705" y="535" width="640" height="320" class="panel"/>
<text x="730" y="570" class="rh">中东与非洲 · MIDDLE EAST &amp; AFRICA</text>
<rect x="730" y="592" width="280" height="99" class="amber"/>
<text x="749" y="618" class="ct">沙特阿拉伯 / Saudi Arabia</text><text x="749" y="643" class="tx">ZATCA Phase 2 · Fatoora 按波次集成</text><text x="749" y="669" class="date">第25波目标：2027-02-01</text>
<rect x="1032" y="592" width="285" height="99" class="tag"/>
<text x="1051" y="618" class="ct">肯尼亚 / Kenya</text><text x="1051" y="643" class="tx">eTIMS · 广泛经营者开具电子税票</text><text x="1051" y="669" class="date">小微供应商另设买方代开工具</text>
<rect x="730" y="711" width="587" height="99" fill="#f3f4ef" stroke="#d3d9d2" stroke-width="1.5" rx="12"/>
<text x="749" y="737" class="ct">比较时记住 / Keep the dimensions separate</text><text x="749" y="762" class="tx">文件格式 · 交易网络 · 税务平台 · 报告时点 · 买方业务处理</text><text x="749" y="788" class="date">同一国家可以同时存在多条数据和合规路径</text>
</svg>