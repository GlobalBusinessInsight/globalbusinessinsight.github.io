<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" rx="24" fill="#f7f5ef"/><text x="600" y="66" text-anchor="middle" fill="#17333b" font-family="Arial,'PingFang SC',sans-serif" font-size="31" font-weight="700">屏幕上都能打开，系统处理方式却不同</text>
<g font-family="Arial,'PingFang SC',sans-serif"><rect x="54" y="120" width="344" height="430" rx="12" fill="#fffefa" stroke="#d6ddd6"/><rect x="428" y="120" width="344" height="430" rx="12" fill="#fffefa" stroke="#d6ddd6"/><rect x="802" y="120" width="344" height="430" rx="12" fill="#eaf0e9" stroke="#b9cabc"/>
<text x="226" y="167" text-anchor="middle" fill="#526569" font-size="22" font-weight="700">扫描件 / 图片</text><rect x="145" y="194" width="164" height="190" rx="7" fill="#e7e6df"/><path d="M165 225h124M165 247h105M165 290h124M165 312h90M165 354h124" stroke="#9a9e96" stroke-width="7" stroke-linecap="round"/><circle cx="270" cy="358" r="20" fill="#c1a367" opacity=".85"/><text x="226" y="425" text-anchor="middle" fill="#17333b" font-size="18" font-weight="700">图像信息</text><text x="226" y="462" text-anchor="middle" fill="#526569" font-size="15">靠人查看和录入</text><text x="226" y="501" text-anchor="middle" fill="#9a5545" font-size="14">自动处理能力有限</text>
<text x="600" y="167" text-anchor="middle" fill="#526569" font-size="22" font-weight="700">普通 PDF</text><rect x="520" y="194" width="160" height="190" rx="7" fill="#fff" stroke="#d6ddd6"/><path d="M544 226h110M544 248h94M544 290h110M544 312h94M544 354h110" stroke="#b6c3bb" stroke-width="6" stroke-linecap="round"/><text x="600" y="425" text-anchor="middle" fill="#17333b" font-size="18" font-weight="700">可视化文档</text><text x="600" y="462" text-anchor="middle" fill="#526569" font-size="15">人读容易，系统未必懂</text><text x="600" y="501" text-anchor="middle" fill="#9a5545" font-size="14">常需识别或手工录入</text>
<text x="974" y="167" text-anchor="middle" fill="#17634f" font-size="22" font-weight="700">结构化电子发票</text><rect x="883" y="194" width="182" height="190" rx="7" fill="#17333b"/><text x="902" y="229" fill="#d0ad6c" font-size="15">&lt;Invoice&gt;</text><text x="902" y="259" fill="#dce6dd" font-size="14">&lt;Seller&gt;...&lt;/Seller&gt;</text><text x="902" y="289" fill="#dce6dd" font-size="14">&lt;Date&gt;...&lt;/Date&gt;</text><text x="902" y="319" fill="#dce6dd" font-size="14">&lt;TaxTotal&gt;...&lt;/TaxTotal&gt;</text><text x="902" y="349" fill="#d0ad6c" font-size="15">&lt;/Invoice&gt;</text><text x="974" y="425" text-anchor="middle" fill="#17333b" font-size="18" font-weight="700">字段化数据</text><text x="974" y="462" text-anchor="middle" fill="#526569" font-size="15">系统可读取、校验和传递</text><text x="974" y="501" text-anchor="middle" fill="#17634f" font-size="14">支持端到端自动化</text></g><text x="600" y="604" text-anchor="middle" fill="#71807c" font-family="Arial,'PingFang SC',sans-serif" font-size="14">提示：混合格式也可能同时包含人可读的 PDF 与结构化数据；是否合规取决于当地规则。</text></svg>
