<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">电子发票系统参考架构 / E-invoicing reference architecture</title>
<desc id="desc">ERP与销售采购系统生成交易数据，经数据映射、校验与集成服务后，按当地规则进入集中税务平台、Peppol等互联交换网络，或直连买方并另行报送。回执、业务状态、监控和归档贯穿全程。This is a reference model, not a universal country design.</desc>
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="none" stroke="#277767" stroke-width="1.6"/></marker>
 <marker id="arrowgray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="none" stroke="#687b7e" stroke-width="1.6"/></marker>
 <style>.ink{fill:#183943}.muted{fill:#5c7175}.small{font:15px Arial,sans-serif}.label{font:700 18px Arial,sans-serif}.sub{font:14px Arial,sans-serif}.box{fill:#fffefa;stroke:#a9c3ba;stroke-width:2}.green{fill:#e7f1ec;stroke:#348a72;stroke-width:2}.blue{fill:#eaf0f5;stroke:#829bb0;stroke-width:2}.amber{fill:#f5efe2;stroke:#c49851;stroke-width:2}.red{fill:#f9ece7;stroke:#d58772;stroke-width:2}.lane{fill:#fbfaf6;stroke:#d7dfd8;stroke-width:1.5}.line{stroke:#277767;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.back{stroke:#687b7e;stroke-width:1.8;stroke-dasharray:6 5;fill:none;marker-end:url(#arrowgray)}</style>
</defs>
<rect width="1200" height="760" rx="18" fill="#f7f5ef"/>
<text x="42" y="48" class="label ink">电子发票系统参考架构</text>
<text x="42" y="72" class="sub muted">Reference architecture · Components vary by country, sector and regulatory model</text>

<!-- Business origin and integration layer -->
<rect x="38" y="103" width="228" height="118" rx="12" class="box"/>
<text x="58" y="137" class="label ink">业务系统</text>
<text x="58" y="163" class="sub muted">ERP · 销售/采购 · 订单</text>
<text x="58" y="186" class="sub muted">交付、税务主数据、付款条款</text>

<rect x="326" y="103" width="260" height="118" rx="12" class="green"/>
<text x="348" y="137" class="label ink">映射、校验与集成</text>
<text x="348" y="163" class="sub muted">语义模型 → 当地格式</text>
<text x="348" y="186" class="sub muted">规则检查 · API/EDI · 队列</text>

<rect x="650" y="103" width="230" height="118" rx="12" class="blue"/>
<text x="672" y="137" class="label ink">传输与路由</text>
<text x="672" y="163" class="sub muted">地址解析 · 认证 · 加密</text>
<text x="672" y="186" class="sub muted">消息编号 · 重试与对账</text>

<rect x="944" y="103" width="218" height="118" rx="12" class="box"/>
<text x="966" y="137" class="label ink">买方系统</text>
<text x="966" y="163" class="sub muted">收票 · 订单/收货匹配</text>
<text x="966" y="186" class="sub muted">审批 · 入账 · 付款</text>
<path d="M266 162 H315" class="line"/><path d="M586 162 H639" class="line"/><path d="M880 162 H933" class="line"/>

<text x="38" y="260" class="small ink" font-weight="700">常见连接方式示例（实际规则以当地制度与交易安排为准）</text>
<!-- lane 1 -->
<rect x="38" y="277" width="1124" height="116" rx="12" class="lane"/>
<rect x="54" y="294" width="178" height="82" rx="9" class="red"/>
<text x="70" y="323" class="label ink">集中清关 / 验证</text><text x="70" y="348" class="sub muted">税务平台参与交换</text>
<rect x="308" y="294" width="202" height="82" rx="9" class="box"/>
<text x="327" y="323" class="label ink">开票方</text><text x="327" y="348" class="sub muted">生成并提交发票</text>
<rect x="605" y="294" width="218" height="82" rx="9" class="amber"/>
<text x="627" y="323" class="label ink">税务机关平台</text><text x="627" y="348" class="sub muted">接收 / 校验 / 返回状态</text>
<rect x="929" y="294" width="202" height="82" rx="9" class="box"/>
<text x="948" y="323" class="label ink">买方</text><text x="948" y="348" class="sub muted">收到并处理</text>
<path d="M510 335 H595" class="line"/><path d="M823 335 H919" class="line"/>
<text x="55" y="389" class="sub muted">例：巴西 NF-e 授权；意大利 SdI 交换（适用范围与处理规则各有规定）</text>
<!-- lane 2 -->
<rect x="38" y="409" width="1124" height="116" rx="12" class="lane"/>
<rect x="54" y="426" width="178" height="82" rx="9" class="blue"/>
<text x="70" y="455" class="label ink">互联交换网络</text><text x="70" y="480" class="sub muted">独立于税务机关平台</text>
<rect x="308" y="426" width="202" height="82" rx="9" class="box"/>
<text x="327" y="455" class="label ink">发送方接入点</text><text x="327" y="480" class="sub muted">服务商 / Access Point</text>
<rect x="605" y="426" width="218" height="82" rx="9" class="green"/>
<text x="627" y="455" class="label ink">网络路由</text><text x="627" y="480" class="sub muted">发现接收端并安全传输</text>
<rect x="929" y="426" width="202" height="82" rx="9" class="box"/>
<text x="948" y="455" class="label ink">接收方接入点 → 买方</text><text x="948" y="480" class="sub muted">交付回执与业务响应</text>
<path d="M510 467 H595" class="line"/><path d="M823 467 H919" class="line"/>
<text x="55" y="521" class="sub muted">例：Peppol 四角模型；税务报告是否同时发生，取决于该地法律</text>
<!-- lane 3 -->
<rect x="38" y="541" width="1124" height="83" rx="12" class="lane"/>
<text x="60" y="576" class="label ink">直连或服务商传输 → 买方系统</text>
<text x="60" y="602" class="sub muted">税务数据可按周期或实时另行报送；也可能不要求交易级报送</text>
<rect x="897" y="554" width="233" height="56" rx="9" class="amber"/>
<text x="916" y="578" class="sub ink" font-weight="700">税务报送（如适用）</text>
<text x="916" y="598" class="sub muted">与商业送达路径可分开</text>

<!-- persistent control and lifecycle -->
<rect x="38" y="644" width="1124" height="77" rx="12" class="green"/>
<text x="60" y="675" class="label ink">贯穿各层：状态管理、监控、对账与归档</text>
<text x="60" y="702" class="sub muted">传输回执 ≠ 税务处理结果 ≠ 买方审批 ≠ 付款到账 · 保存原始数据、规则版本、时间戳与关联证据</text>
<path d="M1043 221 V260" class="back"/>
</svg>