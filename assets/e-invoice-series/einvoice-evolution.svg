<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc">
<title id="title">电子发票演进：从纸票到数字税务报告</title><desc id="desc">非按比例时间线显示纸票、电子文件、EDI、共同语义标准、互联网络和税务数字报告的演进，并说明数据格式、交换传输和税务控制三层并存。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#17333b"/><stop offset="1" stop-color="#315b52"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c9ad6b"/></marker></defs>
<rect width="1400" height="940" rx="24" fill="#f5f3ec"/><text x="72" y="78" fill="#17634f" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">E-INVOICING / A LAYERED EVOLUTION</text>
<text x="72" y="133" fill="#17333b" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="38" font-weight="700">从纸面凭证，到可互联、可报告的交易数据</text>
<text x="72" y="173" fill="#607074" font-family="Arial,sans-serif" font-size="19">概念时间线 · 不按比例 · 各阶段长期并存，实施时间因市场而异</text>
<line x1="130" y1="500" x2="1270" y2="500" stroke="#c9ad6b" stroke-width="6" marker-end="url(#arrow)"/>
<g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle">
<g transform="translate(110 0)"><circle cx="60" cy="500" r="19" fill="#17634f"/><rect x="4" y="266" width="112" height="154" rx="10" fill="#fffefa" stroke="#d6ddd6" stroke-width="3"/><path d="M28 305h64M28 330h64M28 355h48" stroke="#91a69b" stroke-width="8" stroke-linecap="round"/><text x="60" y="220" fill="#17634f" font-size="21" font-weight="700">纸面凭证</text><text x="60" y="455" fill="#17333b" font-size="17">人工交付</text><text x="60" y="555" fill="#354d53" font-size="16">人读、录入</text></g>
<g transform="translate(330 0)"><circle cx="60" cy="500" r="19" fill="#17634f"/><rect x="2" y="274" width="116" height="146" rx="9" fill="#e9eee8" stroke="#9db1a5" stroke-width="3"/><rect x="18" y="292" width="84" height="83" rx="4" fill="#fff" stroke="#c7d1c9" stroke-width="2"/><path d="M28 311h62M28 330h48M28 349h54" stroke="#91a69b" stroke-width="6" stroke-linecap="round"/><text x="60" y="220" fill="#17634f" font-size="21" font-weight="700">电子文件</text><text x="60" y="455" fill="#17333b" font-size="17">扫描 / PDF</text><text x="60" y="555" fill="#354d53" font-size="16">便于传递，未必可自动处理</text></g>
<g transform="translate(550 0)"><circle cx="60" cy="500" r="19" fill="#17634f"/><rect x="0" y="280" width="120" height="130" rx="10" fill="#e7eee7" stroke="#9db1a5" stroke-width="3"/><text x="60" y="322" fill="#17634f" font-size="19" font-weight="700">EDI</text><path d="M22 344h76M22 366h76M22 388h76" stroke="#90a69a" stroke-width="6"/><text x="60" y="220" fill="#17634f" font-size="21" font-weight="700">结构化消息</text><text x="60" y="455" fill="#17333b" font-size="17">UN/EDIFACT</text><text x="60" y="555" fill="#354d53" font-size="16">计算机到计算机交换</text></g>
<g transform="translate(770 0)"><circle cx="60" cy="500" r="19" fill="#17634f"/><rect x="0" y="278" width="120" height="136" rx="10" fill="#17333b"/><path d="M25 309h70M25 339h52M25 369h63" stroke="#d4c08b" stroke-width="8" stroke-linecap="round"/><text x="60" y="220" fill="#17634f" font-size="21" font-weight="700">语义标准</text><text x="60" y="455" fill="#17333b" font-size="17">如 EN 16931</text><text x="60" y="555" fill="#354d53" font-size="16">字段含义与语法对齐</text></g>
<g transform="translate(990 0)"><circle cx="60" cy="500" r="19" fill="#17634f"/><circle cx="25" cy="315" r="17" fill="#17634f"/><circle cx="95" cy="315" r="17" fill="#17634f"/><circle cx="25" cy="385" r="17" fill="#315b52"/><circle cx="95" cy="385" r="17" fill="#315b52"/><path d="M25 315h70M25 385h70M25 315v70M95 315v70" stroke="#c9ad6b" stroke-width="4"/><text x="60" y="220" fill="#17634f" font-size="21" font-weight="700">互联网络</text><text x="60" y="455" fill="#17333b" font-size="17">如 Peppol</text><text x="60" y="555" fill="#354d53" font-size="16">发现伙伴并路由消息</text></g>
<g transform="translate(1210 0)"><circle cx="60" cy="500" r="19" fill="#17634f"/><rect x="2" y="278" width="116" height="136" rx="10" fill="#fffefa" stroke="#17634f" stroke-width="4"/><path d="M22 303h72M22 331h72M22 359h48" stroke="#91a69b" stroke-width="7" stroke-linecap="round"/><circle cx="88" cy="375" r="15" fill="#c9ad6b"/><path d="m81 375 5 5 10-12" fill="none" stroke="#17333b" stroke-width="3"/><text x="60" y="220" fill="#17634f" font-size="21" font-weight="700">税务数字化</text><text x="60" y="455" fill="#17333b" font-size="17">报告 / 验证 / 清算</text><text x="60" y="555" fill="#354d53" font-size="16">监管数据时点与规则</text></g>
</g>
<rect x="72" y="634" width="1256" height="236" rx="16" fill="url(#bg)"/><text x="108" y="684" fill="#d9c28e" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">THREE LAYERS COEXIST</text>
<g font-family="Arial,'Microsoft YaHei',sans-serif"><text x="108" y="738" fill="#fffefa" font-size="23" font-weight="700">01  数据表达</text><text x="390" y="738" fill="#dce6dd" font-size="19">纸张 · 图片 · PDF · XML</text><text x="108" y="788" fill="#fffefa" font-size="23" font-weight="700">02  交换传输</text><text x="390" y="788" fill="#dce6dd" font-size="19">EDI · 企业接口 · 互联网络</text><text x="108" y="838" fill="#fffefa" font-size="23" font-weight="700">03  税务控制</text><text x="390" y="838" fill="#dce6dd" font-size="19">事后申报 · 数字报告 · 实时验证 · 清算</text></g></svg>