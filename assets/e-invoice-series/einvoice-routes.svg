<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
<title id="title">电子发票技术路线分层 / E-invoice technical routes</title>
<desc id="desc">Invoice data passes through semantic, syntax, implementation-rule, discovery and transport layers; the tax-reporting flow is separate from but can intersect with delivery to the buyer. An acknowledgment at one layer does not prove completion at the next.</desc>
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#17634f" stroke-width="2"/></marker>
 <marker id="arrblue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#45698b" stroke-width="2"/></marker>
 <style>
 text{font-family:Arial,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#17333b}
 .title{font-size:29px;font-weight:700}.sub{font-size:15px;fill:#526569}.label{font-size:17px;font-weight:700}.small{font-size:14px}.note{font-size:13px;fill:#526569}
 .layer{fill:#fffefa;stroke:#cbd6cf;stroke-width:2;rx:14}.pill{fill:#eaf0e9;stroke:#c3d2c7;stroke-width:1.5;rx:20}.box{fill:#f5f6f1;stroke:#bac9bf;stroke-width:1.5;rx:12}.tax{fill:#fff4e6;stroke:#c9944a;stroke-width:2;rx:14}
 .flow{fill:none;stroke:#17634f;stroke-width:3;marker-end:url(#arrow)}.taxflow{fill:none;stroke:#45698b;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#arrblue)}
 </style>
</defs>
<rect width="1400" height="920" fill="#f4f5f0"/>
<text x="54" y="60" class="title">电子发票的技术路线：分层组合，而非单一协议</text>
<text x="54" y="88" class="sub">E-invoice routes are assembled from separate layers · 传输成功 ≠ 税务通过 ≠ 买方接受</text>

<rect x="54" y="122" width="1292" height="84" class="layer"/>
<text x="78" y="154" class="label">1 · 业务语义 / BUSINESS SEMANTICS</text>
<text x="78" y="183" class="small">EN 16931 core model · UN/CEFACT terms · seller, lines, tax, totals, order references</text>

<path d="M700 207 L700 230" class="flow"/>
<rect x="54" y="232" width="1292" height="104" class="layer"/>
<text x="78" y="265" class="label">2 · 载荷语法 / PAYLOAD SYNTAX</text>
<rect x="78" y="281" width="180" height="38" class="pill"/><text x="104" y="306" class="small">UBL XML</text>
<rect x="276" y="281" width="210" height="38" class="pill"/><text x="302" y="306" class="small">UN/CEFACT CII</text>
<rect x="504" y="281" width="230" height="38" class="pill"/><text x="530" y="306" class="small">EDIFACT INVOIC</text>
<rect x="752" y="281" width="310" height="38" class="pill"/><text x="778" y="306" class="small">Hybrid / embedded XML</text>
<text x="1090" y="305" class="note">格式承载字段，不负责路由</text>

<path d="M700 336 L700 360" class="flow"/>
<rect x="54" y="362" width="1292" height="90" class="layer"/>
<text x="78" y="395" class="label">3 · 实施规则 / IMPLEMENTATION PROFILE</text>
<rect x="78" y="410" width="260" height="31" class="pill"/><text x="96" y="432" class="small">CIUS / country rules</text>
<rect x="356" y="410" width="250" height="31" class="pill"/><text x="374" y="432" class="small">Peppol BIS / PINT</text>
<rect x="624" y="410" width="294" height="31" class="pill"/><text x="642" y="432" class="small">codes · Schematron · versions</text>
<text x="948" y="432" class="note">必填、代码、约束、业务流程</text>

<path d="M700 452 L700 475" class="flow"/>
<rect x="54" y="477" width="1292" height="190" class="layer"/>
<text x="78" y="510" class="label">4 · 发现、封装与传输 / DISCOVERY, ENVELOPE &amp; TRANSPORT</text>
<rect x="78" y="532" width="390" height="85" class="box"/>
<text x="100" y="561" class="small" font-weight="700">Peppol four-corner</text><text x="100" y="586" class="small">SMP/SML discovery → AS4 between Access Points</text><text x="100" y="607" class="note">network-specific PKI and message controls</text>
<rect x="505" y="532" width="365" height="85" class="box"/>
<text x="527" y="561" class="small" font-weight="700">Direct / government gateway</text><text x="527" y="586" class="small">REST/JSON · SOAP/XML · local API</text><text x="527" y="607" class="note">authentication · idempotency · async status</text>
<rect x="907" y="532" width="400" height="85" class="box"/>
<text x="929" y="561" class="small" font-weight="700">Partner / legacy exchange</text><text x="929" y="586" class="small">EDI VAN · managed file transfer · portal</text><text x="929" y="607" class="note">partner mapping · endpoint-specific operations</text>
<text x="80" y="646" class="note">加密、身份认证、参与方寻址与消息状态由具体网络/接口规范定义，不能仅从文件后缀推断。</text>

<path d="M700 667 L700 695" class="flow"/>
<rect x="815" y="699" width="531" height="88" class="layer"/>
<text x="840" y="731" class="label">商业交换 / COMMERCIAL DELIVERY</text>
<text x="840" y="760" class="small">Buyer receipt → business response → matching &amp; posting</text>

<rect x="54" y="699" width="690" height="88" class="tax"/>
<text x="80" y="731" class="label">监管报送 / REGULATORY REPORTING</text>
<text x="80" y="760" class="small">clearance · central exchange · continuous reporting · post-audit</text>
<path d="M450 667 C450 684 400 680 400 699" class="taxflow"/>
<path d="M1090 667 C1090 684 1130 680 1130 699" class="flow"/>
<text x="54" y="822" class="note">虚线：独立的税务数据路径；实线：商业送达路径。法规可能要求两条路径在不同时间或节点交汇。</text>
<rect x="54" y="846" width="1292" height="48" fill="#e6eee7" rx="10"/>
<text x="78" y="876" class="small" font-weight="700">状态边界：传输回执 ≠ 税务机关批准 ≠ 买方业务接受 ≠ 付款完成</text>
</svg>