<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">电子发票端到端生命周期 / E-invoice lifecycle</title>
<desc id="desc">从交易与开票，经校验和交换网络，到买方审批、入账、付款与归档；税务平台只在特定监管模式中作为可选节点。技术回执、税务确认和买方业务状态彼此不同。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#17634f"/></marker><marker id="thin" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#9b7651"/></style></defs>
<rect width="1200" height="560" rx="18" fill="#f7f5ef"/>
<text x="46" y="48" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17634f" letter-spacing="2">BUSINESS FLOW / 业务主线</text>
<g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle">
<g><rect x="40" y="82" width="180" height="120" rx="12" fill="#fffefa" stroke="#b9c8bc" stroke-width="2"/><text x="130" y="121" font-size="18" font-weight="700" fill="#17333b">交易证据</text><text x="130" y="151" font-size="14" fill="#526569">订单 · 交付 · 合同</text><text x="130" y="176" font-size="14" fill="#526569">Order · fulfilment</text></g>
<g><rect x="278" y="82" width="190" height="120" rx="12" fill="#fffefa" stroke="#b9c8bc" stroke-width="2"/><text x="373" y="121" font-size="18" font-weight="700" fill="#17333b">开具与校验</text><text x="373" y="151" font-size="14" fill="#526569">结构化数据 · 规则</text><text x="373" y="176" font-size="14" fill="#526569">Issue · validate</text></g>
<g><rect x="526" y="82" width="190" height="120" rx="12" fill="#fffefa" stroke="#b9c8bc" stroke-width="2"/><text x="621" y="121" font-size="18" font-weight="700" fill="#17333b">传输与回执</text><text x="621" y="151" font-size="14" fill="#526569">路由 · 技术送达</text><text x="621" y="176" font-size="14" fill="#526569">Exchange · receipt</text></g>
<g><rect x="774" y="82" width="190" height="120" rx="12" fill="#fffefa" stroke="#b9c8bc" stroke-width="2"/><text x="869" y="121" font-size="18" font-weight="700" fill="#17333b">接收与审批</text><text x="869" y="151" font-size="14" fill="#526569">匹配 · 异常 · 决策</text><text x="869" y="176" font-size="14" fill="#526569">Receive · approve</text></g>
<g><rect x="1010" y="82" width="150" height="120" rx="12" fill="#e5eee6" stroke="#17634f" stroke-width="2"/><text x="1085" y="121" font-size="18" font-weight="700" fill="#17333b">入账与付款</text><text x="1085" y="151" font-size="14" fill="#526569">记录 · 结算</text><text x="1085" y="176" font-size="14" fill="#526569">Post · pay</text></g>
<g fill="none" stroke="#17634f" stroke-width="3" marker-end="url(#arrow)"><path d="M220 142h48"/><path d="M468 142h48"/><path d="M716 142h48"/><path d="M964 142h38"/></g>
<g><rect x="1010" y="340" width="150" height="112" rx="12" fill="#e5eee6" stroke="#17634f" stroke-width="2"/><text x="1085" y="379" font-size="18" font-weight="700" fill="#17333b">归档与检索</text><text x="1085" y="409" font-size="14" fill="#526569">原始数据 · 轨迹</text><text x="1085" y="434" font-size="14" fill="#526569">Archive · retrieve</text></g>
<path d="M1085 202v130" fill="none" stroke="#17634f" stroke-width="3" marker-end="url(#arrow)"/>
<g><rect x="370" y="340" width="340" height="112" rx="12" fill="#f4eade" stroke="#c1a367" stroke-width="2" stroke-dasharray="8 6"/><text x="540" y="378" font-size="18" font-weight="700" fill="#17333b">税务平台 / 税务报送（仅适用时）</text><text x="540" y="409" font-size="14" fill="#526569">事前清关 · 事后报送 · 定期报告 · 不适用</text><text x="540" y="434" font-size="14" fill="#526569">Tax authority — conditional by regime</text></g>
<path d="M620 202v128" fill="none" stroke="#9b7651" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#thin)"/>
<text x="638" y="270" text-anchor="start" font-size="13" fill="#806244">按当地模式</text>
<path d="M775 397H720" fill="none" stroke="#9b7651" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#thin)"/>
<path d="M278 188C190 255 118 262 110 210" fill="none" stroke="#9b7651" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#thin)"/>
<text x="160" y="280" font-size="14" fill="#806244">退回、补正或重开</text>
<text x="600" y="520" font-size="14" fill="#526569">技术送达 ≠ 税务确认 ≠ 买方验收 ≠ 付款；每一状态须有明确发出方、对象与证据。</text>
</g></svg>